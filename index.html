<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Archon Auth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F0F05;color:#F5F0E0;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{border:1px solid rgba(255,255,102,0.3);padding:32px;max-width:600px;width:100%;border-radius:8px}
h1{color:#FFFF66;font-size:20px;margin-bottom:8px}
p{color:#A8A080;font-size:13px;margin-bottom:20px}
.token-box{background:#1A1A0A;border:1px solid rgba(255,255,102,0.2);border-radius:6px;padding:16px;word-break:break-all;font-size:12px;color:#FFFF66;margin-bottom:16px;cursor:pointer}
.btn{background:#FFFF66;color:#0F0F05;border:none;padding:10px 24px;border-radius:4px;font-weight:bold;cursor:pointer;font-size:14px}
.success{color:#00ff99;font-size:13px;margin-top:8px;display:none}
.error{color:#ff6666;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Archon V2 — Auth Complete</h1>
  <p id="status">Reading your token...</p>
  <div id="token-box" class="token-box" onclick="copyToken()" style="display:none"></div>
  <button class="btn" onclick="copyToken()" id="copy-btn" style="display:none">Copy Full URL</button>
  <p class="success" id="success">Copied! Paste it in Termux.</p>
  <p class="error" id="error" style="display:none"></p>
</div>
<script>
var fullUrl = window.location.href;
var hash = window.location.hash.substring(1);
var params = new URLSearchParams(hash);
var token = params.get('access_token');
var error = params.get('error');

if (error) {
  document.getElementById('status').textContent = 'Auth failed: ' + error;
  document.getElementById('error').textContent = error;
  document.getElementById('error').style.display = 'block';
} else if (token) {
  document.getElementById('status').textContent = 'Login successful! Copy the URL below and paste it in Termux:';
  document.getElementById('token-box').textContent = fullUrl;
  document.getElementById('token-box').style.display = 'block';
  document.getElementById('copy-btn').style.display = 'inline-block';
} else {
  document.getElementById('status').textContent = 'No token found. Try logging in again.';
}

function copyToken() {
  navigator.clipboard.writeText(fullUrl).then(function() {
    document.getElementById('success').style.display = 'block';
  });
}
</script>
</body>
</html>
